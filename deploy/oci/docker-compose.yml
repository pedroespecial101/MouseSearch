services:
  ts-mousesearch:
    image: tailscale/tailscale:v1.94.2
    container_name: ts-mousesearch
    hostname: ${TS_HOSTNAME:-mousesearch}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME:-mousesearch}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TZ: ${TZ:-Europe/London}
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - /opt/appdata/mousesearch/tailscale:/var/lib/tailscale
      - /opt/appdata/mousesearch/serve.json:/config/serve.json:ro
    restart: unless-stopped

  mousesearch:
    build:
      context: /home/ubuntu/projects/MouseSearch
    container_name: mousesearch
    network_mode: service:ts-mousesearch
    depends_on:
      - ts-mousesearch
    environment:
      TZ: ${TZ:-Europe/London}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      QUART_SECRET_KEY: ${QUART_SECRET_KEY}
      MAM_ID: ${MAM_ID}
      TORRENT_CLIENT_TYPE: ${TORRENT_CLIENT_TYPE:-qbittorrent}
      TORRENT_CLIENT_URL: ${TORRENT_CLIENT_URL}
      TORRENT_CLIENT_USERNAME: ${TORRENT_CLIENT_USERNAME}
      TORRENT_CLIENT_PASSWORD: ${TORRENT_CLIENT_PASSWORD}
      TORRENT_CLIENT_CATEGORY: ${TORRENT_CLIENT_CATEGORY:-}
      QB_FORCE_START: ${QB_FORCE_START:-false}
      RTORRENT_DIGEST_AUTH: ${RTORRENT_DIGEST_AUTH:-false}
      USE_MOUSEHOLE_MAM_COOKIE: ${USE_MOUSEHOLE_MAM_COOKIE:-false}
      MOUSEHOLE_API_URL: ${MOUSEHOLE_API_URL:-http://mousehole:5010}
      HAPTICS_ENABLED: ${HAPTICS_ENABLED:-true}
      AUTO_BUY_PERSONAL_FL_ON_DOWNLOAD_MIN_SIZE_ENABLED: ${AUTO_BUY_PERSONAL_FL_ON_DOWNLOAD_MIN_SIZE_ENABLED:-false}
      AUTO_BUY_PERSONAL_FL_ON_DOWNLOAD_MIN_SIZE_MB: ${AUTO_BUY_PERSONAL_FL_ON_DOWNLOAD_MIN_SIZE_MB:-0}
      AUTO_TASK_WEBHOOK_URL: ${AUTO_TASK_WEBHOOK_URL:-}
      AUTO_TASK_WEBHOOK_EVENTS: ${AUTO_TASK_WEBHOOK_EVENTS:-}
      AUTO_TASK_WEBHOOK_METHOD: ${AUTO_TASK_WEBHOOK_METHOD:-POST}
      AUTO_TASK_WEBHOOK_PARAMS: ${AUTO_TASK_WEBHOOK_PARAMS:-}
      AUTO_TASK_WEBHOOK_BODY: ${AUTO_TASK_WEBHOOK_BODY:-}
      HARDCOVER_ENRICHMENT_ENABLED: ${HARDCOVER_ENRICHMENT_ENABLED:-true}
      HARDCOVER_API_TOKEN: ${HARDCOVER_API_TOKEN:-}
      HARDCOVER_API_URL: ${HARDCOVER_API_URL:-https://api.hardcover.app/v1/graphql}
      HARDCOVER_USER_AGENT: ${HARDCOVER_USER_AGENT:-MouseSearch Hardcover Enrichment}
      HARDCOVER_RATE_LIMIT: ${HARDCOVER_RATE_LIMIT:-60}
      HARDCOVER_MATCH_THRESHOLD: ${HARDCOVER_MATCH_THRESHOLD:-78}
      HARDCOVER_CONCURRENCY: ${HARDCOVER_CONCURRENCY:-6}
      HARDCOVER_SEARCH_PER_PAGE: ${HARDCOVER_SEARCH_PER_PAGE:-5}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      ACCESS_LOGFILE: ${ACCESS_LOGFILE:-/dev/null}
      DATA_PATH: /data
      AUTO_ORGANIZE_ON_ADD: "false"
      AUTO_ORGANIZE_ON_SCHEDULE: "false"
      AUTO_ORGANIZE_USE_COPY: "false"
    volumes:
      - /opt/appdata/mousesearch/data:/data
    restart: unless-stopped

  mousesearch-mcp:
    profiles: ["mcp"]
    build:
      context: /home/ubuntu/projects/MouseSearch
    container_name: mousesearch-mcp
    network_mode: service:ts-mousesearch
    depends_on:
      - ts-mousesearch
      - mousesearch
    environment:
      TZ: ${TZ:-Europe/London}
      MOUSESEARCH_API_BASE_URL: ${MOUSESEARCH_API_BASE_URL:-http://127.0.0.1:5000/api/v1}
      MOUSESEARCH_API_TOKEN: ${MOUSESEARCH_API_TOKEN:-}
      MOUSESEARCH_MCP_HOST: 0.0.0.0
      MOUSESEARCH_MCP_PORT: ${MOUSESEARCH_MCP_PORT:-8765}
    command: ["python", "mcp_server.py"]
    restart: unless-stopped
